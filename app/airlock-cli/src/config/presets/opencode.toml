# opencode preset (cloud inference)
#
# Runs the opencode CLI (https://opencode.ai) against cloud model providers —
# Anthropic, OpenAI, OpenRouter, Google, Groq, and the 75+ others opencode
# supports through the AI SDK. opencode is provider-agnostic, so instead of
# allow-listing a single API host this preset opens egress by default: it can
# reach whichever provider you configure, pull model metadata from models.dev,
# and fetch any non-bundled provider SDK from npm on first use.
#
# Authenticate once inside the sandbox with `opencode auth login`; the
# credential is written to the persisted data dir below and reused on later
# runs. No API key is injected from the host.
#
# For a privacy-first setup that opens NO egress and only talks to a local
# inference server on the host, use the `opencode-local` preset instead.

[network]
# opencode talks to whichever provider you pick, so egress is open by default.
# `allow-by-default` still honours explicit deny rules, so you can carve out
# blocked hosts, or switch to `deny-by-default` + explicit allows if you only
# ever use one provider and want to lock egress down.
policy = "allow-by-default"

[env]
# opencode (Bun/Node) trusts this CA bundle for HTTPS. It is the system public
# root store, so providers' real certificates validate as-is; it also means
# that if you later add auth middleware, airlock's interception CA (installed
# into the same store) is picked up without extra setup.
NODE_EXTRA_CA_CERTS = "/etc/ssl/certs/ca-certificates.crt"

# Persist opencode's data dir (sessions, projects, auth.json) across runs so
# you stay logged in to your providers.
[mounts.opencode-data]
source = "~/.airlock/opencode/data"
target = "~/.local/share/opencode"
missing = "create-dir"

# Persist opencode's global config across runs. Seeded minimally — opencode
# discovers cloud providers from models.dev plus your login, so no provider
# block is required here. Add a `model` / `provider` block on the host at the
# source path below to pin a default; your edits persist across runs.
[mounts.opencode-config]
source = "~/.airlock/opencode/opencode.json"
target = "~/.config/opencode/opencode.json"
missing = "create-file"
file_content = '''
{
  "$schema": "https://opencode.ai/config.json"
}
'''
