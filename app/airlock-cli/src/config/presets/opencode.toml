# opencode preset (local inference)
#
# Runs the opencode CLI (https://opencode.ai) against a local inference server
# on the HOST (Ollama / LM Studio / llama.cpp). Network is otherwise denied;
# the guest→host port forwards below bypass the network policy so the sandbox
# reaches the host server at localhost:<port> while all other egress stays
# blocked. (Requires deny-by-default, NOT deny-always.)

[env]
# opencode (Bun/Node) trusts this CA for any HTTPS it makes. Local inference
# over http://localhost is a passthrough forward and unaffected either way.
NODE_EXTRA_CA_CERTS = "/etc/ssl/certs/ca-certificates.crt"

# Expose the common host inference servers inside the sandbox. Guest→host
# forwards bypass network rules, so these work even with all other network
# denied. Disable any you don't run (`enabled = false`) to avoid shadowing
# that host port inside the guest — note 8080 is a common host dev port.
[network.ports.opencode-inference]
host = [
    11434,  # Ollama
    1234,   # LM Studio
    8080,   # llama.cpp (llama-server)
]

# Persist opencode's data dir (sessions, projects, auth.json) across runs.
[mounts.opencode-data]
source = "~/.airlock/opencode/data"
target = "~/.local/share/opencode"
missing = "create-dir"

# Seed a starter global config pointing at the forwarded host servers.
# Only written if missing; later edits persist on the host. Adjust the model
# IDs to match what you have pulled/loaded on the host.
[mounts.opencode-config]
source = "~/.airlock/opencode/opencode.json"
target = "~/.config/opencode/opencode.json"
missing = "create-file"
file_content = '''
{
  "$schema": "https://opencode.ai/config.json",
  "provider": {
    "ollama": {
      "npm": "@ai-sdk/openai-compatible",
      "name": "Ollama (host)",
      "options": { "baseURL": "http://localhost:11434/v1" },
      "models": { "qwen2.5-coder:latest": { "name": "Qwen2.5 Coder" } }
    },
    "lmstudio": {
      "npm": "@ai-sdk/openai-compatible",
      "name": "LM Studio (host)",
      "options": { "baseURL": "http://localhost:1234/v1" },
      "models": { "local-model": { "name": "LM Studio model" } }
    },
    "llamacpp": {
      "npm": "@ai-sdk/openai-compatible",
      "name": "llama.cpp (host)",
      "options": { "baseURL": "http://localhost:8080/v1" },
      "models": { "local-model": { "name": "llama.cpp model" } }
    }
  }
}
'''
